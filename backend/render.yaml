# Render Blueprint — https://render.com/docs/blueprint-spec
# One click: connect this repo's `backend/` folder as the root directory,
# then Render provisions the web service + managed Postgres from this file.
services:
  - type: web
    name: vasthuconnect-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vasthuconnect-db
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false   # set in the Render dashboard to https://veeralaxmevastu.com (this repo can't set it — Render env vars marked sync:false are dashboard-only)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        # NOT generateValue: true — this must be an exact 32-byte value,
        # hex-encoded (64 hex characters), because it's used directly as an
        # AES-256-GCM key. Render's generateValue doesn't know that shape
        # constraint and can produce a value the wrong length, which throws
        # "invalid key length" the moment a survey number is ever encrypted
        # (that 500 surfaces as a generic "Something went wrong" in prod).
        # Generate a correct one with: openssl rand -hex 32
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMS_PROVIDER
        value: console
      - key: EMAIL_PROVIDER
        value: sendgrid   # Render's outbound network can't reach Hostinger's SMTP server (connections hang ~2min then fail) — SendGrid delivers over HTTPS instead, which isn't affected. Uses Single Sender Verification (no DNS changes needed)
      - key: EMAIL_FROM
        value: "VeeraaLaxme Vastu <noreply@veeralaxmevastu.com>"
      - key: SENDGRID_API_KEY
        sync: false   # set in the Render dashboard — from app.sendgrid.com, after verifying noreply@veeralaxmevastu.com as a Single Sender
      - key: RESEND_API_KEY
        sync: false   # set in the Render dashboard — alternative provider (needs full domain DNS verification), not used while EMAIL_PROVIDER=sendgrid
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        value: noreply@veeralaxmevastu.com
      - key: SMTP_PASS
        sync: false   # set in the Render dashboard — the Hostinger mailbox password, never committed. Kept as a fallback option; not used while EMAIL_PROVIDER=sendgrid
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: vasthuconnect-db
    plan: free
