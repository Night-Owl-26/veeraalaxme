# Render Blueprint — https://render.com/docs/blueprint-spec
# One click: connect this repo's `backend/` folder as the root directory,
# then Render provisions the web service + managed Postgres from this file.
services:
  - type: web
    name: vasthuconnect-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vasthuconnect-db
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false   # set to your Vercel URL, e.g. https://vasthuconnect.vercel.app
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMS_PROVIDER
        value: console
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: vasthuconnect-db
    plan: free
